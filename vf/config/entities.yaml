  - vscode
  - intellij
  - visualstudio
  - xcode

features:
  - code_completion
  - chat_panel_ask_mode
  - chat_panel_edit_mode
  - agent_edit
  - chat_inline

models:
  - gpt-4o
  - gpt-4o-mini
  - claude-4.0-sonnet
  - claude-4.5-sonnet

# AI assistants for this org. Same schema as the shared entities.yaml so the
# existing tool helpers (tool_rollout_date / tool_allocation_on /
# assign_users_to_tool) work unchanged.
ai_tools:
  - name: "github copilot"
    allocation: 25
    rollout_offset_days: 0
    active_share: 0.80
    productivity_mult: 1.00
    chat_share: 0.35
    primary_models:
      - gpt-4o
      - gpt-4o-mini
  - name: "cursor"
    allocation: 12
    rollout_offset_days: 150
    active_share: 0.85
    productivity_mult: 1.25
    chat_share: 0.55
    primary_models:
      - claude-4.0-sonnet
      - gpt-4o
  - name: "claude code"
    allocation: 8
    rollout_offset_days: 260
    active_share: 0.90
    productivity_mult: 1.65
    chat_share: 0.70
    primary_models:
      - claude-4.5-sonnet
      - claude-4.0-sonnet
