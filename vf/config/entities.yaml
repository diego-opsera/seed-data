# demo-acme-vf — VisualForge demo org.
#
# Deliberately separate from the shared /config/entities.yaml, which owns
# demo-acme-engineering (core batch) and demo-acme-direct (direct batch) for
# vnxt-insights-api. Nothing here overlaps those orgs.
#
# IDENTITY IS THE CONTRACT. VisualForge's DVI and Tokenomics ETLs join every
# source on LOWER(TRIM(email)) and drop any row whose identity fails the gates
# in sharedIdentity.js. The `email` below is therefore the join key that every
# vf/ generator must reuse verbatim — in commits (commit_email), PRs
# (github_commit_email / author email), Jira (assignee_email), Sonar (author)
# and AI tool usage. One mismatch silently removes a developer from
# individuals[] with no error anywhere.
#
# Roster validated against all five gates by vf/generators/identity_gates.py.

enterprise:
  id: 999999
  name: "demo-acme-corp"

orgs:
  - id: 9990003
    name: "demo-acme-vf"           # VisualForge batch — safe to wipe independently

# GitHub org login used in repo full_name and PR/commit payloads.
github_org: "demo-acme-vf"

teams:
  - name: "vf-platform"
    slug: "vf-platform"
    org_name: "demo-acme-vf"
  - name: "vf-payments"
    slug: "vf-payments"
    org_name: "demo-acme-vf"
  - name: "vf-data"
    slug: "vf-data"
    org_name: "demo-acme-vf"
  - name: "vf-mobile"
    slug: "vf-mobile"
    org_name: "demo-acme-vf"

# Repos. `team` binds a repo to its owning team so commits/PRs/GHA runs stay
# coherent per developer. html_url doubles as project_url in base_datasets.
repos:
  - name: "demo-acme-vf/platform-api"
    html_url: "https://github.com/demo-acme-vf/platform-api"
    team: "vf-platform"
  - name: "demo-acme-vf/payments-service"
    html_url: "https://github.com/demo-acme-vf/payments-service"
    team: "vf-payments"
  - name: "demo-acme-vf/data-pipeline"
    html_url: "https://github.com/demo-acme-vf/data-pipeline"
    team: "vf-data"
  - name: "demo-acme-vf/mobile-app"
    html_url: "https://github.com/demo-acme-vf/mobile-app"
    team: "vf-mobile"
  - name: "demo-acme-vf/web-console"
    html_url: "https://github.com/demo-acme-vf/web-console"
    team: "vf-platform"

# Jira project backing v_itsm_issues_hist rows for this org.
jira_project:
  key: "VFD"
  name: "VisualForge Delivery"

# ── Roster ──────────────────────────────────────────────────────────────────
# 25 developers. Constraints each row satisfies (see identity_gates.py):
#   login  — ^[a-z0-9._-]{3,}$, no 'svc'/'service'/'admin' substring, not all
#            digits, not bot-like (no '-bot', '[bot]', 'dependabot', 'copilot*',
#            'github-actions*', 'renovate', 'web-flow', 'agent', 'cursoragent')
#   email  — real address; local part <=12 chars passes outright, longer local
#            parts must not look like a hashed token (a '.' separator is enough)
#   name   — derived by the ETL as emailToName(email), so 'first.last' yields
#            'First Last' and initials 'FL'. First token must not be an opaque
#            20+ char token.
